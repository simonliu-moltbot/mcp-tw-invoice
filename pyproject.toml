[project]
name = "mcp-tw-invoice"
version = "0.1.0"
description = "A FastMCP server for Taiwan Uniform Invoice Lottery checking."
authors = [{name = "AI Assistant", email = "ai@example.com"}]
dependencies = [
    "fastmcp>=0.4.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0"
]
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
