[project]
name = "mcp-tw-invoice"
version = "0.1.0"
description = "A FastMCP server for Taiwan Uniform Invoice Lottery checking."
authors = [{name = "AI Assistant", email = "ai@example.com"}]
dependencies = [
    "mcp>=1.2.0",
    "starlette>=0.36.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
